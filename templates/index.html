<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #FF3621 0%, #FF6B35 100%);
      padding: 32px;
      color: white;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .hint {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 1.6;
    }

    .content {
      padding: 32px;
    }

    .form-section {
      background: #f8f9fa;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 32px;
      border: 1px solid #e9ecef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #495057;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      transition: all 0.3s ease;
      background: white;
      color: #333;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #FF3621;
      box-shadow: 0 0 0 3px rgba(255, 54, 33, 0.1);
    }

    input[type="text"]::placeholder {
      color: #adb5bd;
    }

    button {
      margin-top: 16px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #FF3621 0%, #FF6B35 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 54, 33, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 54, 33, 0.4);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(255, 54, 33, 0.3);
    }

    #result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      background: #e7f5ff;
      border-left: 4px solid #339af0;
      color: #1864ab;
      min-height: 20px;
      display: none;
    }

    #result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    #result.error {
      background: #ffe0e0;
      border-left-color: #ff6b6b;
      color: #c92a2a;
    }

    #result.success {
      background: #d3f9d8;
      border-left-color: #51cf66;
      color: #2b8a3e;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .table-section {
      margin-top: 32px;
    }

    .table-header {
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #FF3621;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    thead {
      background: linear-gradient(135deg, #495057 0%, #6c757d 100%);
      color: white;
    }

    th {
      text-align: left;
      padding: 16px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    tbody tr {
      transition: all 0.2s ease;
      border-bottom: 1px solid #e9ecef;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8f9fa;
      transform: scale(1.01);
    }

    td {
      padding: 16px;
      color: #495057;
      font-size: 14px;
    }

    td:first-child {
      font-weight: 700;
      color: #FF3621;
      font-size: 16px;
    }

    td:nth-child(3) {
      font-weight: 600;
      color: #2b8a3e;
      font-family: 'Courier New', monospace;
    }

    tbody tr:empty::after {
      content: 'No watchlist items yet. Add a ticker symbol above to get started!';
      display: block;
      padding: 40px;
      text-align: center;
      color: #adb5bd;
      font-style: italic;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 10px;
      }

      .header, .content {
        padding: 24px 20px;
      }

      h1 {
        font-size: 24px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📈 Stock Watchlist</h1>
      <p class="hint">Track your favorite stocks with real-time pricing from the Massive API</p>
    </div>

    <div class="content">
      <div class="form-section">
        <form id="stock-form">
          <label for="symbol">Ticker Symbol</label>
          <input type="text" id="symbol" name="symbol" placeholder="e.g., AAPL, MSFT, GOOGL" required>
          <button type="submit">Add to Watchlist</button>
        </form>
        <div id="result"></div>
      </div>

      <div class="table-section">
        <div class="table-header">Your Watchlist</div>
        <table id="watchlist-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Email</th>
              <th>Latest Price</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody id="watchlist-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error loading watchlist: " + (data.error || resp.statusText), 'error');
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? "$" + Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        showResult("Failed to load watchlist: " + err, 'error');
      }
    }

    function showResult(message, type = 'info') {
      resultEl.textContent = message;
      resultEl.className = 'show ' + type;
      setTimeout(() => {
        resultEl.className = '';
      }, 5000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      showResult("Adding " + symbol + " to watchlist...", 'info');

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          showResult(data.error || resp.statusText, 'error');
          return;
        }
        showResult("✓ Successfully added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2), 'success');
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        showResult("Request failed: " + err, 'error');
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
